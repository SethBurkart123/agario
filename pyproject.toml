[project]
name = "agario"
version = "0.1.0"
description = "Offline training tools for the Rust Agar.io simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agario-core",
    "numpy>=1.26",
    # Linux (the GPU box) is pinned to cu128 wheels: its driver supports CUDA
    # 12.8 and newer default wheels (cu130) fail with NCCL symbol errors.
    "torch>=2.4; sys_platform == 'darwin'",
    "torch==2.8.0; sys_platform == 'linux'",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agario*", "bot_solutions*"]
namespaces = false

[tool.uv.workspace]
members = [
    "agario_core",
]

[tool.uv.sources]
agario-core = { workspace = true }
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
