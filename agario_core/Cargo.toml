[package]
name = "agario-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "agario_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
pyo3 = { version = "0.23", features = ["abi3-py311"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
